# Production overlay — apply on top of the base file, never alone:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from the dev-oriented base:
# - SQL Server and Redis no longer publish ports to the host — only the "api" service (and
#   anything else on the same Docker network) can reach them.
# - The API runs in the Production environment (appsettings.Production.json: compact JSON
#   console logs, meant for a log-aggregation pipeline rather than human reading).
# - No local .eml pickup-directory fallback for email — Email__Host (a real SMTP relay) is
#   required; silently writing undeliverable files to disk is a dev convenience, not a
#   production behavior.

services:
  sqlserver:
    ports: []

  redis:
    ports: []

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Email__PickupDirectory: ""
    restart: always
